kind = "web"
previewPath = "/"
title = "ديار الأحلام - Dayar Al-Ahlam"
version = "1.0.0"
id = "artifacts/dayar-al-ahlam"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19223

[services.development]
run = "pnpm --filter @workspace/dayar-al-ahlam run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dayar-al-ahlam", "run", "build" ]
publicDir = "artifacts/dayar-al-ahlam/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19223"
BASE_PATH = "/"
